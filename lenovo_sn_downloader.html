<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenovo Unlock Image Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .card h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
            text-align: center;
        }

        .card p {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        button {
            width: 100%;
            padding: 12px 16px;
            margin-top: 8px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: scale(0.98);
        }

        .error {
            color: #f87171;
            font-size: 0.8125rem;
            display: none;
            margin-top: -4px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Download Bootloader Image</h1>
        <p>Enter your device's <code>bootloader_sn</code> below to be redirected to your <code>sn.img</code> download file.</p>
        
        <form id="snForm" class="form-group" onsubmit="handleRedirect(event)">
            <label for="snInput">Bootloader Serial Number</label>
            <input 
                type="text" 
                id="snInput" 
                placeholder="e.g. HA123456" 
                autocomplete="off" 
                required 
            />
            <span id="errorMsg" class="error">Please enter a valid serial number.</span>
            
            <button type="submit">Download sn.img</button>
        </form>
    </div>

    <script>
        function handleRedirect(event) {
            event.preventDefault();
            
            const snInput = document.getElementById('snInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (!snInput) {
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            
            // Construct CDN redirect URL
            const targetUrl = `http://cdn.zui.lenovomm.com/developer/enhancedboot/${encodeURIComponent(snInput)}/sn.img`;
            
            // Redirect user directly
            window.location.href = targetUrl;
        }
    </script>

</body>
</html>
