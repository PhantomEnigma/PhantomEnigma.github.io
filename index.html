<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom — Hub & Projects</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .profile-card {
            background: var(--card-bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            margin-bottom: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 16px;
        }

        .profile-name {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .profile-handle {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 16px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            border-color: var(--accent);
            background: var(--card-hover);
            transform: translateY(-1px);
            text-decoration: none;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 28px 0 14px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .resource-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .resource-card:hover {
            background: var(--card-hover);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.4);
            text-decoration: none;
        }

        .resource-info h3 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .resource-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .arrow {
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: transform 0.2s, color 0.2s;
        }

        .resource-card:hover .arrow {
            color: var(--accent);
            transform: translateX(4px);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Profile Section -->
        <header class="profile-card">
            <video class="avatar" autoplay loop muted playsinline>
                <source src="assets/pf.webm" type="video/webm">
            </video>
            <h1 class="profile-name">Phantom</h1>
            <div class="profile-handle">@PhantomEnigma</div>
            
            <div class="social-links">
                <a href="https://github.com/PhantomEnigma" target="_blank" rel="noopener" class="social-btn">
                    <span>GitHub</span>
                </a>
                <a href="https://telegram.me/PhantomEnigma" target="_blank" rel="noopener" class="social-btn">
                    <span>Telegram</span>
                </a>
            </div>
        </header>

        <!-- Device Guides -->
        <div class="section-title">📱 Device Guides</div>
        <div class="grid">
            <a href="devices/moto-pad-60-neo/bootloader-unlock.html" class="resource-card">
                <div class="resource-info">
                    <h3>Moto Pad 60 Neo</h3>
                    <p>Bootloader Unlock Guide (ZUI Firmware)</p>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>

        <!-- Utilities & Tools -->
        <div class="section-title">🛠️ Utilities &amp; Tools</div>
        <div class="grid">
            <a href="tools/lenovo-sn-downloader.html" class="resource-card">
                <div class="resource-info">
                    <h3>Lenovo SN Downloader</h3>
                    <p>Fetch official sn.img bootloader unlock files directly from CDN</p>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>

        <footer>
            &copy; PhantomEnigma — All rights reserved.
        </footer>

    </div>

</body>
</html>
